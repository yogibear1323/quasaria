<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Quasaria</title>
  <desc id="d">Illustrative Quasaria mark: a quasar whose tilted accretion disk forms a Q, with a relativistic jet as the Q's tail, set in a nebula-filled deep-space disc.</desc>
  <defs>
    <radialGradient id="space" cx="46%" cy="40%" r="68%">
      <stop offset="0" stop-color="#2c1670"/>
      <stop offset="0.45" stop-color="#140b3d"/>
      <stop offset="1" stop-color="#05030f"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38f3ff"/>
      <stop offset="0.5" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#ff3dcb"/>
    </linearGradient>
    <radialGradient id="nebPink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3dcb" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff3dcb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9b5cff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38f3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38f3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diskFront" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.3" stop-color="#ffb347"/>
      <stop offset="0.62" stop-color="#ff3dcb"/>
      <stop offset="1" stop-color="#8f4dff"/>
    </linearGradient>
    <linearGradient id="diskBack" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b3cff"/>
      <stop offset="0.5" stop-color="#c2338f"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <linearGradient id="diskHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#fff3c4" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#e8fdff"/>
      <stop offset="0.45" stop-color="#7ff8ff"/>
      <stop offset="0.7" stop-color="#38f3ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38f3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jetTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#bafcff"/>
      <stop offset="0.6" stop-color="#38f3ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jetUp" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8fdff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38f3ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#d9c7ff"/>
      <stop offset="0.35" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#1b0d4d"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="cloud" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="228"/></clipPath>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0-10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10Z" fill="#ffffff"/>
    </symbol>
  </defs>

  <!-- Outer glow + bezel -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#bezel)" stroke-width="14" opacity="0.35" filter="url(#bigGlow)"/>
  <circle cx="256" cy="256" r="228" fill="url(#space)"/>

  <g clip-path="url(#disc)">
    <!-- Nebula clouds -->
    <ellipse cx="150" cy="140" rx="150" ry="90" fill="url(#nebViolet)" filter="url(#cloud)" transform="rotate(-25 150 140)"/>
    <ellipse cx="380" cy="360" rx="160" ry="95" fill="url(#nebPink)" filter="url(#cloud)" transform="rotate(-30 380 360)"/>
    <ellipse cx="330" cy="120" rx="110" ry="60" fill="url(#nebCyan)" filter="url(#cloud)" transform="rotate(20 330 120)"/>
    <ellipse cx="110" cy="380" rx="110" ry="60" fill="url(#nebCyan)" opacity="0.6" filter="url(#cloud)"/>
    <!-- Dust lane -->
    <path d="M20 300 C120 250 220 330 300 280 S440 250 500 210" stroke="#05030f" stroke-opacity="0.55" stroke-width="26" fill="none" filter="url(#cloud)"/>
    <!-- Starfield -->
    <g fill="#ffffff">
      <circle cx="72" cy="190" r="1.6" opacity="0.9"/><circle cx="96" cy="110" r="1.1" opacity="0.7"/>
      <circle cx="160" cy="70" r="1.4" opacity="0.8"/><circle cx="212" cy="46" r="1" opacity="0.6"/>
      <circle cx="300" cy="60" r="1.3" opacity="0.8"/><circle cx="420" cy="120" r="1.2" opacity="0.7"/>
      <circle cx="455" cy="210" r="1.6" opacity="0.9"/><circle cx="470" cy="300" r="1" opacity="0.6"/>
      <circle cx="60" cy="300" r="1.2" opacity="0.7"/><circle cx="90" cy="420" r="1.5" opacity="0.8"/>
      <circle cx="170" cy="460" r="1" opacity="0.6"/><circle cx="250" cy="475" r="1.3" opacity="0.7"/>
      <circle cx="120" cy="250" r="0.9" opacity="0.5"/><circle cx="390" cy="60" r="0.9" opacity="0.5"/>
      <circle cx="350" cy="455" r="1.1" opacity="0.6"/><circle cx="40" cy="240" r="0.8" opacity="0.5"/>
    </g>
    <!-- Counter-jet (up-left, fainter, behind the disk) -->
    <path d="M256 256 L118 92 L106 104 Z" fill="url(#jetUp)" opacity="0.8" filter="url(#glow)"/>
    <path d="M256 256 L124 96 L112 100 Z" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Accretion disk, BACK half (drawn behind the core) -->
  <g transform="rotate(-28 256 256)">
    <path d="M106 256 A150 112 0 0 1 406 256" fill="none" stroke="url(#diskBack)" stroke-width="30" stroke-linecap="round" opacity="0.9"/>
    <path d="M128 250 A128 92 0 0 1 384 250" fill="none" stroke="#ffd9f4" stroke-width="2.5" opacity="0.45"/>
    <path d="M92 256 A164 124 0 0 1 420 256" fill="none" stroke="#9b5cff" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Quasar core -->
  <circle cx="256" cy="256" r="92" fill="url(#core)" opacity="0.55" filter="url(#bigGlow)"/>
  <circle cx="256" cy="256" r="50" fill="url(#core)"/>
  <circle cx="256" cy="256" r="17" fill="#ffffff" filter="url(#glow)"/>
  <!-- Lens flare -->
  <g opacity="0.85" filter="url(#glow)">
    <path d="M150 256 L362 256" stroke="#e8fdff" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M256 180 L256 332" stroke="#e8fdff" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Accretion disk, FRONT half (in front of the core) -->
  <g transform="rotate(-28 256 256)">
    <path d="M106 256 A150 112 0 0 0 406 256" fill="none" stroke="url(#diskFront)" stroke-width="40" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M122 262 A134 96 0 0 0 390 262" fill="none" stroke="url(#diskHi)" stroke-width="5" stroke-linecap="round"/>
    <path d="M100 262 A156 118 0 0 0 412 262" fill="none" stroke="#fff3c4" stroke-width="1.6" opacity="0.6"/>
    <!-- plasma knots riding the disk -->
    <circle cx="170" cy="330" r="4" fill="#fff6d8" filter="url(#glow)"/>
    <circle cx="330" cy="352" r="3.2" fill="#ffe1f7" filter="url(#glow)"/>
  </g>

  <!-- Relativistic jet = the tail of the Q -->
  <g filter="url(#glow)">
    <path d="M262 262 L452 470 L476 446 L270 252 Z" fill="url(#jetTail)"/>
    <path d="M266 258 L462 458" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>
  <circle cx="404" cy="416" r="5" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>

  <!-- Orbiting planet with ring -->
  <g transform="translate(392 146)">
    <ellipse cx="0" cy="0" rx="34" ry="9" fill="none" stroke="#ffd166" stroke-width="2.5" opacity="0.55" transform="rotate(-18)"/>
    <circle r="19" fill="url(#planet)"/>
    <path d="M-12 -9 A17 17 0 0 1 8 -15" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M-34 5 A34 9 0 0 0 30 -14" transform="rotate(-4)" fill="none" stroke="#ffd166" stroke-width="2.5" opacity="0.95"/>
  </g>

  <!-- Sparkles -->
  <use href="#spark" x="98" y="152" width="22" height="22" opacity="0.95"/>
  <use href="#spark" x="344" y="70" width="14" height="14" opacity="0.8"/>
  <use href="#spark" x="430" y="262" width="18" height="18" opacity="0.85"/>
  <use href="#spark" x="126" y="392" width="16" height="16" opacity="0.8"/>
  <use href="#spark" x="226" y="96" width="10" height="10" opacity="0.7"/>

  <!-- Bezel ring on top -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#bezel)" stroke-width="6"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
