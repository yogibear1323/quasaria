<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t d">
  <title id="t">Quasaria — Beacon</title>
  <desc id="d">Quasaria mark: a star-bright core inside a tilted accretion disk, firing bipolar relativistic jets.</desc>
  <defs>
