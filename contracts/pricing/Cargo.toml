[package]
name = "quasaria-pricing"
description = "Quasaria perps pricing library: skew-premium mark price, funding rate and funding-index math (pure functions)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
quasaria-gov = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
