<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PropertyRoot mark, option A: roots grow from the base of the Quasaria Q into a small house outline">
  <title>PropertyRoot: Rooted Q + house (option A)</title>
  <defs>
    <linearGradient id="ring" x1="14" y1="6" x2="50" y2="42" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D9A06A"/><stop offset=".45" stop-color="#B8603A"/><stop offset="1" stop-color="#D9973A"/></linearGradient>
    <linearGradient id="root" x1="32" y1="36" x2="32" y2="62" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B8603A"/><stop offset=".6" stop-color="#D9973A"/><stop offset="1" stop-color="#F6DFA8"/></linearGradient>
    <radialGradient id="core" cx="32" cy="22" r="5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#F6DFA8"/><stop offset="1" stop-color="#D9973A"/></radialGradient>
    <radialGradient id="halo" cx="32" cy="22" r="13" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F6DFA8" stop-opacity=".9"/><stop offset=".5" stop-color="#D9973A" stop-opacity=".35"/><stop offset="1" stop-color="#B8603A" stop-opacity="0"/></radialGradient>
    <linearGradient id="tail" x1="36" y1="26" x2="47" y2="37" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#F6DFA8"/><stop offset=".75" stop-color="#D9973A"/><stop offset="1" stop-color="#5E6B3C"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#glow)">
  <circle cx="32" cy="22" r="13" fill="url(#halo)"/>
  <circle cx="32" cy="22" r="14" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <circle cx="32" cy="22" r="4.2" fill="url(#core)"/>
  <path d="M36.5 26.5 L47 37" stroke="url(#tail)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- tail of the Q becomes the taproot -->
  <path d="M32 36 C32 40 31 42 32 45" stroke="url(#root)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- roots branch out and draw the house: roof, walls, ground -->
  <path d="M32 45 L19 53 M32 45 L45 53" stroke="url(#root)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M22 51.5 V60 H42 V51.5" stroke="#D9973A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <path d="M29.5 60 V55.5 H34.5 V60" stroke="#F6DFA8" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
  <path d="M19 41 C23 41 26 43 28 45 M45 41 C41 41 38 43 36 45" stroke="#B8603A" stroke-width="1.2" stroke-linecap="round" fill="none" opacity=".75"/>
  <path d="M10 61.5 H54" stroke="#5E6B3C" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 45.5 c2-3 5-3.5 7-3 c-1 2.5-4 4-7 3z" fill="#5E6B3C"/>
  </g>
</svg>
