[workspace]
resolver = "2"
members = [
  "reward-token",
  "amm-pool",
  "router",
  "staking",
  "referral",
  "leverage-vault",
  "mock-oracle",
  "gov",
  "lending",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Quasaria contributors"]
publish = false

[workspace.dependencies]
soroban-sdk = "28.0.0"
quasaria-referral = { path = "referral" }
quasaria-amm-pool = { path = "amm-pool" }
quasaria-mock-oracle = { path = "mock-oracle" }
quasaria-reward-token = { path = "reward-token" }
quasaria-gov = { path = "gov" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
