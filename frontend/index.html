<!doctype html>
<html lang="en" class="frost">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Stale-index guard (runs before the bundle): if a cached index.html points at hashed assets a newer deploy
      // deleted, the page would stay blank. Reload once with a cache-busting query to fetch the current index.
      addEventListener("error", function (e) {
        var t = e.target, u = t && (t.src || t.href);
        if (!u || u.indexOf("/assets/") < 0) return;
        try { if (sessionStorage.getItem("qz.stale-guard") === location.pathname) return; sessionStorage.setItem("qz.stale-guard", location.pathname); } catch (x) {}
        var q = new URLSearchParams(location.search); q.set("r", Date.now());
        location.replace(location.pathname + "?" + q + location.hash);
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quasaria — Trade on the Stellar Decentralized Exchange</title>
    <meta name="description" content="Quasaria is a client for the Stellar network. Send, receive, and trade assets on the Stellar network easily with Quasaria. Testnet beta, unaudited." />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="theme-color" content="#0b1428" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Quasaria — Trade on the Stellar Decentralized Exchange" />
    <meta property="og:description" content="Quasaria is a client for the Stellar network. Send, receive, and trade assets on the Stellar network easily with Quasaria. Testnet beta, unaudited." />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quasaria — Trade on the Stellar Decentralized Exchange" />
    <meta name="twitter:description" content="Quasaria is a client for the Stellar network. Send, receive, and trade assets on the Stellar network easily with Quasaria." />
    <style>
      /* Splash: shown until React mounts */
      #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
        background:radial-gradient(ellipse at 50% 42%,rgba(200,216,240,.18) 0%,rgba(11,20,40,0) 55%),#0b1428;z-index:9999;transition:opacity .45s}
      #splash img{width:96px;height:96px;animation:qpulse 1.8s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(200,225,255,.55))}
      #splash span{font:600 13px/1 system-ui,sans-serif;letter-spacing:.42em;color:#e3eaf4;text-transform:uppercase}
      @keyframes qpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      #splash.gone{opacity:0;pointer-events:none}
      @media (prefers-reduced-motion:reduce){#splash img{animation:none}}
    </style>
  </head>
  <body>
    <div id="splash"><img src="/brand/logo-light.svg" alt="Quasaria" /><span>Quasaria</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
