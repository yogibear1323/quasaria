name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild + redeploy every 30 minutes so the build-time news snapshot (and the
  # market snapshot) stay current without commits. Scheduled runs always use the
  # default branch (main), which the github-pages environment allows, and share
  # the "pages" concurrency group below, so they queue behind (never cancel) a
  # push deploy. Off-the-hour minutes avoid GitHub's top-of-hour cron backlog.
  # Note: GitHub pauses schedules after 60 days without repository activity.
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # stellarchain.io blocks browsers on github.io (no CORS), so bake a fresh
      # market snapshot into the build for the landing cards, XLM ticker and the
      # Markets page (whose mainnet tab is live from Horizon and uses this
      # snapshot for its asset list and as the fallback when Horizon fails). The script keeps the last committed snapshot and exits 0 on
      # any failure; continue-on-error is a second safety net.
      - name: Market data snapshot (stellarchain.io -> public/data)
        run: node scripts/fetch-market-snapshot.mjs
        continue-on-error: true
        timeout-minutes: 3
      # Stellar news: public RSS feeds (SDF blog, Stellar Community on Medium,
      # Cointelegraph's Stellar tag, CoinDesk + Decrypt filtered to Stellar/XLM/Soroban)
      # -> public/data/news-snapshot.json. None of the feeds allow CORS from github.io,
      # so the browser reads this bundled file. Keeps each failed source's previous
      # items and always exits 0; continue-on-error is a second safety net.
      - name: Stellar news snapshot (RSS -> public/data)
        run: node scripts/fetch-news-snapshot.mjs
        continue-on-error: true
        timeout-minutes: 3
      - name: Build (served under /<repo>/)
        run: npm run build
        env:
          # "/quasaria/" for https://<owner>.github.io/quasaria/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_NETWORK: testnet
      - name: SPA deep-link fallback
        run: test -f dist/404.html || cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
