      <stop offset="0" stop-color="#7C5CFF"/><stop offset=".55" stop-color="#5B6CFF"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="b-jetU" x1="32" y1="30" x2="32" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#A5F3FC"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b-jetD" x1="32" y1="34" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#C4B5FD"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="b-core" cx="32" cy="32" r="3.6" gradientUnits="userSpaceOnUse">
