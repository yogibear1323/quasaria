[package]
name = "quasaria-lending"
description = "Quasaria supply/borrow lending pool (multi-reserve, index accounting, oracle health factor, liquidations)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
quasaria-gov = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
quasaria-mock-oracle = { workspace = true }
