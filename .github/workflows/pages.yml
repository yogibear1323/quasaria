name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild + redeploy every 30 minutes so the build-time news snapshot (and the
  # market snapshot) stay current without commits. Scheduled runs always use the
  # default branch (main), which the github-pages environment allows, and share
  # the "pages" concurrency group below, so they queue behind (never cancel) a
  # push deploy. Off-the-hour minutes avoid GitHub's top-of-hour cron backlog.
  # Note: GitHub pauses schedules after 60 days without repository activity.
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # stellarchain.io blocks browsers on github.io (no CORS), so bake a fresh
      # market snapshot into the build for the landing cards, XLM ticker and the
      # Markets page (whose mainnet tab is live from Horizon and uses this
      # snapshot for its asset list and as the fallback when Horizon fails). The script keeps the last committed snapshot and exits 0 on
      # any failure; continue-on-error is a second safety net.
      - name: Market data snapshot (stellarchain.io -> public/data)
        run: node scripts/fetch-market-snapshot.mjs
        continue-on-error: true
        timeout-minutes: 3
      # Stellar news: the scheduled "Stellar news" workflow (news.yml) fetches the public feeds every 3 hours and
      # commits news.json to the `news-data` branch (only when it changed). Bundle its latest copy into this build
      # as the same-origin fallback; the browser also reads the branch file live. Without the branch (or if the
      # checkout fails) the news.json committed on main is used.
      - uses: actions/checkout@v7
        with:
          ref: news-data
          path: .news-data
        continue-on-error: true
      - name: Bundle the latest news.json
        working-directory: .
        run: |
          node -e '
            const fs = require("fs");
            const read = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")); } catch { return null; } };
            const next = read(".news-data/news.json");
            const cur = read("frontend/public/data/news.json");
            if (next && Array.isArray(next.items) && (!cur || Date.parse(next.generatedAt) >= Date.parse(cur.generatedAt))) {
              fs.copyFileSync(".news-data/news.json", "frontend/public/data/news.json");
              console.log("bundled news.json from news-data:", next.generatedAt, next.items.length, "items");
            } else console.log("keeping the committed news.json:", cur && cur.generatedAt);
          '
      - name: Build (served at the root of https://quasaria.online/)
        run: npm run build
        env:
          # Custom domain (frontend/public/CNAME): the app lives at the site root.
          VITE_BASE: /
          VITE_SITE_URL: https://quasaria.online
          VITE_NETWORK: mainnet
          # Quasaria trading fee (0.1%, decided 2026-10-19). ON since 2026-10-19 (fee wallet funded, USDC + GLACIERQ trustlines).
          # Set VITE_FEE_BPS to "0" or remove it to turn the fee off (fee wallet = GCFL7SS3SMAT4X2VGROPYXX47P6QIXKYMRNGT5EIFYZRQUAN7GK433J2):
          VITE_FEE_BPS: "10"
          VITE_FEE_WALLET: GCFL7SS3SMAT4X2VGROPYXX47P6QIXKYMRNGT5EIFYZRQUAN7GK433J2
          # Coindisco *publishable* widget key (pk_test_/pk_prod_), a repo Variable, not a secret. Empty = "Card purchase coming soon".
          VITE_COINDISCO_PUBLIC_KEY: ${{ vars.COINDISCO_PUBLIC_KEY }}
      - name: SPA deep-link fallback
        run: test -f dist/404.html || cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
